server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API reverse proxy: /api/... -> gateway:8080/... (prefix stripped)
  # resolve `gateway` per-request via Docker's embedded DNS so recreating the
  # gateway container never strands nginx on a stale IP.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
  }

  # SPA fallback
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
