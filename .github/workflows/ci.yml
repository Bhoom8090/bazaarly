name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: node scripts/check-syntax.js
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/reporting/pom.xml
      - run: mvn -B -ntp -DskipTests package
        working-directory: services/reporting
      - run: mvn -B -ntp test
        working-directory: services/reporting

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, reporting]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
