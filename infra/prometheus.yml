global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['gateway:8080'] }]
  - job_name: identity
    static_configs: [{ targets: ['identity:4001'] }]
  - job_name: catalog
    static_configs: [{ targets: ['catalog:4002'] }]
  - job_name: search
    static_configs: [{ targets: ['search:4003'] }]
  - job_name: inventory
    static_configs: [{ targets: ['inventory:4004'] }]
  - job_name: cart
    static_configs: [{ targets: ['cart:4005'] }]
  - job_name: order
    static_configs: [{ targets: ['order:4006'] }]
  - job_name: payment
    static_configs: [{ targets: ['payment:4007'] }]
  - job_name: notification
    static_configs: [{ targets: ['notification:4008'] }]
  - job_name: fulfilment
    static_configs: [{ targets: ['fulfilment:4009'] }]
  - job_name: mock-psp
    static_configs: [{ targets: ['mock-psp:4010'] }]
